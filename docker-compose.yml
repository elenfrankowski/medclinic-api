services:
  database:
    image: postgres:16-alpine
    container_name: medclinic-postgres
    environment:
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME no .env}
    ports:
      - '${DB_PORT:-5435}:5432'
    volumes:
      - medclinic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ['app']
    build: .
    container_name: medclinic-api
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: '3000'
      DB_HOST: database
      DB_PORT: '5432'
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: 'false'
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Defina ADMIN_EMAIL no .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no .env}
    ports:
      - '3000:3000'

volumes:
  medclinic-postgres-data:
